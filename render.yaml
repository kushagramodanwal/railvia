# Render blueprint. One service: the API, serving the UI it was built with.
#
# Lives at the repository root because that is where Render looks for it.
#
#   1. Push this repo to GitHub
#   2. Render → New → Blueprint → pick this repository → Apply
#
services:
  - type: web
    name: railvia
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: ALLOW_RUNTIME_SOLVE
        value: "0"

      - key: SOLVER_WORKERS
        value: "2"

      # Frontend Supabase configuration
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false

      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

      # Backend Supabase configuration
      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false

      - key: SUPABASE_JWT_SECRET
        sync: false